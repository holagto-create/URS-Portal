<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ISRM Dashboard — RISE Center, SLU</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Lato:ital,wght@0@0;400;0;700;1;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy:#1A3666; --navyD:#0F2245; --navyM:#2A509E; --navyL:#3D6DB5;
      --gold:#C8943A; --goldL:#F0C060; --goldPale:#FDF5E6;
      --bg:#EDF1F8; --card:#FFFFFF; --text:#1C2340; --muted:#607090;
      --border:#C4CFDF;
      --ok:#1A7A3C; --okBg:#E8F5E9;
      --warn:#9A6200; --warnBg:#FFF3CD;
      --new:#6B2D8A; --newBg:#F3EAF7;
      --prog:#1055B5; --progBg:#EEF2FA;
      --err:#B01E28; --errBg:#FDECEA;
      --gray:#607090; --grayBg:#F0F2F5;
      --radius:8px; --shadow:0 2px 10px rgba(0,0,0,.06);
    }
    body { font-family: 'Lato', sans-serif; background: var(--bg); color: var(--text); font-size: 13px; min-height: 100vh; }

    /* ── HEADER ── */
    .hdr {
      background: linear-gradient(135deg, var(--navyD) 0%, var(--navy) 55%, var(--navyM) 100%);
      box-shadow: 0 3px 18px rgba(10,26,60,.38);
      padding: 14px 26px;
      display: flex; align-items: center; gap: 16px;
    }
    .hdr-seal {
      width:46px; height:46px; border-radius:50%; flex-shrink:0;
      background: var(--gold); display:flex; align-items:center; justify-content:center;
      font-family: 'Playfair Display', serif; font-size:15px; font-weight:800; color:var(--navyD);
    }
    .hdr-title { font-family: 'Playfair Display', serif; color:#fff; font-size:17px; font-weight:700; line-height:1.3; }
    .hdr-sub { color:rgba(255,255,255,.55); font-size:10; letter-spacing:.12em; text-transform:uppercase; margin-top:2px; }
    .hdr-right { margin-left:auto; text-align:right; flex-shrink:0; }
    .hdr-sem { color:var(--goldL); font-size:11px; font-weight:700; }
    .hdr-date { color:rgba(255,255,255,.45); font-size:10; margin-top:3px; }

    /* ── NAV TABS ── */
    .nav {
      background: var(--navyD);
      display: flex; padding: 0 26px; gap: 2px;
      overflow-x: auto; scrollbar-width: thin;
    }
    .nav-btn {
      padding: 11px 18px; background: none; border: none;
      color: rgba(255,255,255,.5); cursor: pointer;
      font-family: 'Lato', sans-serif; font-weight:700;
      font-size: 10.5px; letter-spacing:.1em; text-transform:uppercase;
      white-space: nowrap;
      border-bottom: 3px solid transparent;
      transition: color .2s, border-color .2s;
    }
    .nav-btn:hover { color: rgba(255,255,255,.85); }
    .nav-btn.active { color: var(--gold); border-bottom-color: var(--gold); }

    /* ── MAIN ── */
    .main { padding: 22px 26px; max-width: 1140px; margin: 0 auto; }

    /* ── LOADING ── */
    .loading { display:flex; align-items:center; justify-content:center; gap:12px; padding:60px; color:var(--muted); }
    .spinner { width:22px; height:22px; border:3px solid var(--border); border-top-color:var(--navy); border-radius:50%; animation:spin .7s linear infinite; }
    @keyframes spin { to{transform:rotate(360deg)} }

    /* ── CARD ── */
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow);
    }

    /* ── STAT GRID ── */
    .stat-grid { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:20px; }
    .stat-card {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow); padding:18px; flex:1; min-width:130px;
      display:flex; justify-content:space-between; align-items:flex-start;
    }
    .stat-label { font-size:9px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
    .stat-value { font-family: 'Playfair Display', serif; font-size:22px; font-weight:700; color:var(--text); line-height:1; }
    .stat-sub { font-size:10.5px; color:var(--muted); margin-top:5px; }
    .stat-icon { font-size:22px; opacity:.6; }

    /* ── BADGE ── */
    .badge {
      display:inline-block; padding:2px 8px; border-radius:4px;
      font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
      border: 1px solid transparent; white-space:nowrap;
    }
    .badge-Paid       { color:var(--ok);   background:var(--okBg);   border-color:rgba(26,122,60,.2); }
    .badge-Pending    { color:var(--warn); background:var(--warnBg); border-color:rgba(154,98,0,.2); }
    .badge-Completed  { color:var(--ok);   background:var(--okBg);   border-color:rgba(26,122,60,.2); }
    .badge-In Progress{ color:var(--prog); background:var(--progBg);border-color:rgba(16,85,181,.2); }
    .badge-New        { color:var(--new);  background:var(--newBg); border-color:rgba(107,45,138,.2); }
    .badge-Cancelled  { color:var(--err);  background:var(--errBg);  border-color:rgba(176,30,40,.2); }
    .badge-Active     { color:var(--ok);   background:var(--okBg);   border-color:rgba(26,122,60,.2); }
    .badge-Inactive   { color:var(--gray); background:var(--grayBg);border-color:rgba(96,112,144,.2); }
    .badge-SLU        { color:var(--navy); background:var(--progBg); border-color:rgba(26,54,102,.2); }
    .badge-Non-SLU    { color:var(--gray); background:var(--grayBg);border-color:rgba(96,112,144,.2); }
    .badge-Undergraduate{ color:var(--prog); background:var(--progBg);border-color:rgba(16,85,181,.2); }
    .badge-Graduate   { color:var(--new);  background:var(--newBg); border-color:rgba(107,45,138,.2); }
    .badge-Staff      { color:var(--gold); background:var(--goldPale); border-color:rgba(200,148,58,.2); }

    /* ── BUTTON ── */
    .btn {
      border: none; border-radius:5px; cursor:pointer;
      padding: 8px 16px; font-size:12px; font-weight:700; letter-spacing:.05em;
      font-family: 'Lato', sans-serif; transition: opacity .15s;
    }
    .btn:hover { opacity:.82; }
    .btn:disabled { opacity:.5; cursor:not-allowed; }
    .btn-primary { background:var(--navy); color:#fff; }
    .btn-gold    { background:var(--gold); color:#fff; }
    .btn-outline { background:transparent; color:var(--navy); border:1.5px solid var(--navy); }
    .btn-ghost   { background:#F0F4FA; color:var(--text); }
    .btn-danger  { background:var(--err); color:#fff; }
    .btn-sm { padding:5px 11px; font-size:10.5px; }

    /* ── SECTION HEADER ── */
    .shead { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
    .shead h2 { font-family: 'Playfair Display', serif; font-size:17px; font-weight:700; color:var(--navy); }
    .shead-meta { font-size:11px; color:var(--muted); }

    /* ── FORM CONTROLS ── */
    .fin { border:1px solid var(--border); border-radius:5px; padding:7px 10px; font-size:12.5px; font-family:'Lato',sans-serif; color:var(--text); background:#fff; outline:none; width:100%; }
    .fin:focus { border-color:var(--navy); }

    /* ── DASHBOARD ── */
    .dash-grid { display:grid; grid-template-columns:1fr 320px; gap:16px; }
    .dash-activity-item {
      display:flex; align-items:center; gap:14px; padding:11px 18px;
      cursor:pointer; transition: background .12s;
    }
    .dash-activity-item:hover { background:var(--bg); }
    .avatar { width:36px; height:36px; border-radius:50%; background:var(--navyD); color:var(--gold); display:flex; align-items:center; justify-content:center; font-family:'Playfair Display', serif; font-size:13px; font-weight:700; flex-shrink:0; }
    .dash-activity-item + .dash-activity-item { border-top:1px solid var(--bg); }
    .dash-pending-item { padding:12px 16px; border-bottom:1px solid var(--bg); cursor:pointer; transition: background .12s; }
    .dash-pending-item:hover { background:var(--warnBg); }
    .dash-pending-item + .dash-pending-item { border-top:1px solid var(--bg); }

    /* ── CLIENTS TABLE ── */
    .tbl-wrap { overflow-x: auto; }
    table.tbl { width:100%; border-collapse:collapse; font-size:12px; }
    table.tbl th { padding:9px 12px; text-align:left; font-weight:700; font-size:9.5px; letter-spacing:.09em; text-transform:uppercase; color:rgba(255,255,255,.85); white-space:nowrap; }
    table.tbl thead tr { background:var(--navyD); }
    table.tbl td { padding:9px 12px; }
    table.tbl tbody tr { background:#fff; cursor:pointer; transition:background .1s; }
    table.tbl tbody tr:nth-child(even) { background:var(--bg); }
    table.tbl tbody tr:hover { background:#E8EFF8; }
    table.tbl tfoot tr { background:#F5F8FF; border-top:2px solid var(--border); }
    .filter-row { display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; align-items:center; }

    /* ── URS CARDS ── */
    .urs-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(295px,1fr)); gap:14px; }
    .urs-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px; }
    .urs-avatar { width:48px; height:48px; border-radius:50%; flex-shrink:0; background:linear-gradient(135deg,var(--navyD),var(--navyM)); color:var(--gold); display:flex; align-items:center; justify-content:center; font-family:'Playfair Display', serif; font-size:18px; font-weight:700; }
    .urs-row { font-size:11px; margin-bottom:7px; }
    .urs-stat-bar { display:flex; border-top:1px solid var(--border); border-bottom:1px solid var(--border); margin:12px 0; padding:10px 0; gap:0; }
    .urs-stat { flex:1; text-align:center; border-right:1px solid var(--border); }
    .urs-stat:last-child { border-right:none; }
    .urs-stat-val { font-family:'Playfair Display', serif; font-size:20px; font-weight:700; }
    .urs-stat-lbl { font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; }

    /* ── FINANCIAL ── */
    .split-bar { height:16px; border-radius:8px; overflow:hidden; display:flex; margin-bottom:10px; }
    .split-urs { background:linear-gradient(90deg,var(--navyD),var(--navyM)); transition:width .6s; }
    .split-unit { background:linear-gradient(90deg,var(--gold),var(--goldL)); transition:width .6s; }
    .fin-legend { display:flex; gap:24px; }
    .fin-legend-item { display:flex; align-items:center; gap:8px; font-size:12px; }
    .fin-dot { width:10px; height:10px; border-radius:2px; }

    /* ── REPORTS ── */
    .report-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:20px; }
    .report-card { padding:20px; }
    .report-icon { width:44px; height:44px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
    .report-desc { font-size:12px; color:var(--muted); line-height:1.65; margin-bottom:14px; }
    .report-summary { background:var(--bg); border-radius:6px; padding:10px 14px; margin-bottom:16px; }
    .report-summary-row { display:flex; justify-content:space-between; font-size:11.5px; margin-bottom:4px; }
    .report-summary-row:last-child { margin-bottom:0; }
    .report-60-40 { margin-top:20px; padding:12px 16px; background:var(--goldPale); border-left:4px solid var(--gold); border-radius:0 6px 6px 0; font-size:12px; color:var(--muted); line-height:1.7; }

    /* ── MODAL ── */
    .modal-overlay { position:fixed; inset:0; background:rgba(10,20,50,.6); z-index:1000; display:flex; align-items:center; justify-content:center; padding:20px; overflow-y:auto; }
    .modal-box { background:var(--card); border-radius:10px; width:100%; max-width:660px; max-height:92vh; overflow-y:auto; box-shadow:0 24px 64px rgba(0,0,0,.28); }
    .modal-hdr { background:linear-gradient(135deg,var(--navyD),var(--navy)); padding:16px 22px; border-radius:10px 10px 0 0; display:flex; justify-content:space-between; align-items:flex-start; }
    .modal-hdr-title { font-family:'Playfair Display', serif; color:var(--gold); font-size:17px; font-weight:700; }
    .modal-hdr-sub { color:rgba(255,255,255,.7); font-size:11.5px; margin-top:3px; }
    .modal-close { background:none; border:none; color:rgba(255,255,255,.7); cursor:pointer; font-size:22px; line-height:1; padding:0 4px; }
    .modal-body { padding:24px; }
    .modal-field { margin-bottom:13px; }
    .modal-field-label { font-size:9.5px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.09em; margin-bottom:5px; }
    .modal-split { background:linear-gradient(135deg,var(--navyD),var(--navy)); border-radius:8px; padding:14px 18px; margin-bottom:18px; }
    .modal-split-label { color:rgba(255,255,255,.6); font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.1em; margin-bottom:10px; }
    .modal-split-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
    .modal-split-val { font-family:'Playfair Display', serif; font-size:18px; font-weight:700; }
    .modal-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:16px; }

    /* ── REPORT MODAL ── */
    .report-modal-box { background:#fff; border-radius:8px; width:100%; max-width:720px; box-shadow:0 24px 64px rgba(0,0,0,.3); margin-bottom:24px; }
    .report-modal-hdr { background:var(--navyD); padding:12px 20px; border-radius:8px 8px 0 0; display:flex; justify-content:space-between; align-items:center; }
    .report-modal-body { padding:28px 40px; font-size:12px; color:var(--text); line-height:1.65; }
    .report-letterhead { text-align:center; margin-bottom:22px; padding-bottom:16px; border-bottom:2.5px solid var(--navy); }
    .report-letterhead-univ { font-family:'Playfair Display', serif; font-size:17px; font-weight:800; color:var(--navy); letter-spacing:.03em; }
    .report-letterhead-center { font-size:10.5px; color:var(--muted); margin-top:3px; }
    .report-letterhead-title { margin-top:12px; font-size:14px; font-weight:700; color:var(--navy); text-transform:uppercase; letter-spacing:.08em; }

    /* ── POLICY BOX ── */
    .policy-box { margin-top:20px; padding:12px 18px; background:var(--goldPale); border-left:4px solid var(--gold); border-radius:0 6px 6px 0; font-size:12px; color:var(--muted); line-height:1.7; }

    /* ── EMPTY STATE ── */
    .empty-state { padding:36px; text-align:center; color:var(--muted); font-style:italic; }

    /* ── CARD INNER PADDING ── */
    .card-p { padding: 20px; }
    .card-header { padding:13px 18px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
    .card-header h3 { font-family:'Playfair Display', serif; font-size:14px; font-weight:700; color:var(--navy); }
    .section-hdr { padding:8px 18px; background:#F5F8FF; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
    .section-footer { padding:10px 18px; background:var(--navyD); display:flex; justify-content:space-between; border-radius:0 0 8px 8px; }
    .section-footer-total { font-weight:700; color:#fff; font-size:13px; }
    .section-footer-grand { font-weight:700; color:var(--goldL); font-family:'Playfair Display', serif; }

    /* ── ALERTS ── */
    .alert { padding:12px 16px; border-radius:6px; font-size:12px; margin-bottom:14px; }
    .alert-warn { background:var(--warnBg); border-left:4px solid var(--warn); color:var(--warn); }

    /* ── TOAST ── */
    .toast {
      position:fixed; bottom:24px; right:24px; z-index:2000;
      background:var(--navyD); color:#fff; padding:12px 20px;
      border-radius:6px; font-size:12px; font-weight:700;
      box-shadow:0 4px 16px rgba(0,0,0,.3);
      opacity:0; transform:translateY(10px); transition:opacity .2s, transform .2s;
    }
    .toast.show { opacity:1; transform:translateY(0); }
    .toast-ok   { background:var(--ok); }
    .toast-err  { background:var(--err); }
  </style>
</head>
<body>

<!-- ── HEADER ── -->
<div class="hdr">
  <div class="hdr-seal">SLU</div>
  <div>
    <div class="hdr-title">ISRM Officer's Command Center</div>
    <div class="hdr-sub">Institutional Studies &amp; Research Methods — RISE Center &middot; Saint Louis University</div>
  </div>
  <div class="hdr-right">
    <div class="hdr-sem" id="hdr-sem"></div>
    <div class="hdr-date" id="hdr-date"></div>
  </div>
</div>

<!-- ── NAV TABS ── -->
<div class="nav">
  <button class="nav-btn active" data-view="dashboard">&#128202; Dashboard</button>
  <button class="nav-btn" data-view="clients">&#128203; Clients <span id="nav-clients-count"></span></button>
  <button class="nav-btn" data-view="urs">&#128101; URS Registry</button>
  <button class="nav-btn" data-view="financial">&#128176; Financial</button>
  <button class="nav-btn" data-view="reports">&#128196; Reports</button>
</div>

<!-- ── MAIN CONTENT ── -->
<div class="main" id="main-content">
  <div class="loading"><div class="spinner"></div>Loading dashboard...</div>
</div>

<!-- ── MODAL (shared) ── -->
<div id="modal-root" style="display:none;"></div>

<!-- ── TOAST ── -->
<div id="toast" class="toast"></div>

<script>
  // ═══════════════════════════════════════════════════════════
  //  STATE
  // ═══════════════════════════════════════════════════════════
  const state = {
    view: 'dashboard',
    clients: [],
    urs: [],
    financial: {},
    config: {},
    loading: true,
    filterPay: 'All',
    filterStat: 'All',
    filterURS: 'All',
    searchQ: '',
    selectedClient: null,
    reportType: null,
  };

  // ═══════════════════════════════════════════════════════════
  //  HELPERS
  // ═══════════════════════════════════════════════════════════
  const peso = n => `₱${Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2})}`;
  const initials = name => (name||'').split(' ').filter(w=>!['Dr.','Prof.','Mr.','Ms.','Mrs.'].includes(w)).map(w=>w[0]).slice(0,2).join('').toUpperCase();
  const badge = s => {
    if (!s) return '<span class="badge badge-Inactive">—</span>';
    return `<span class="badge badge-${s.replace(/\s/g,'')}">${s}</span>`;
  };
  const URS_PCT = 0.60, UNIT_PCT = 0.40;

  function toast(msg, type='ok') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = `toast toast-${type} show`;
    setTimeout(() => el.classList.remove('show'), 3000);
  }

  function fmtDate(d) {
    if (!d) return '—';
    const date = new Date(d);
    if (isNaN(date)) return d;
    return date.toLocaleDateString('en-PH', {year:'numeric',month:'2-digit',day:'2-digit'});
  }

  function fmtFullDate(d) {
    if (!d) return new Date().toLocaleDateString('en-PH', {year:'numeric',month:'long',day:'numeric'});
    return new Date(d).toLocaleDateString('en-PH', {year:'numeric',month:'long',day:'numeric'});
  }

  // Get field value safely (handles both object props and array indices)
  function g(obj, key, fallback='') {
    if (obj === null || obj === undefined) return fallback;
    if (typeof obj === 'object' && !Array.isArray(obj)) {
      return obj[key] !== undefined ? obj[key] : fallback;
    }
    return fallback;
  }

  // Map row array to named fields (for both object and array responses)
  function mapClient(row, headers) {
    if (Array.isArray(row)) {
      const obj = {};
      headers.forEach((h, i) => { obj[h] = row[i]; });
      return obj;
    }
    return row;
  }

  // ═══════════════════════════════════════════════════════════
  //  DATA LOADING
  // ═══════════════════════════════════════════════════════════
  function loadAll() {
    state.loading = true;
    renderLoading();
    google.script.run
      .withSuccessHandler(data => {
        state.clients = (data.clients||[]).map(c => ({
          row: g(c,'row'),
          id: g(c,'Record ID'),
          date: g(c,'Date'),
          name: g(c,'Client Name'),
          idNum: g(c,'ID Number'),
          contact: g(c,'Contact No.'),
          email: g(c,'Email'),
          department: g(c,'Department/School'),
          title: g(c,'Research Title'),
          funding: g(c,'Funding Source'),
          category: g(c,'Category'),
          affiliation: g(c,'Affiliation'),
          service: g(c,'Service Type'),
          hours: g(c,'Hours', 1),
          totalFee: parseFloat(g(c,'Total Fee (₱)',0))||0,
          orNum: g(c,'OR Number'),
          payDate: g(c,'Payment Date'),
          payStatus: g(c,'Payment Status'),
          assignedURS: g(c,'Assigned URS'),
          ursShare: parseFloat(g(c,'URS Share 60% (₱)',0))||0,
          unitShare: parseFloat(g(c,'Unit Share 40% (₱)',0))||0,
          semester: g(c,'Semester'),
          ay: g(c,'AY'),
          status: g(c,'Status'),
          remarks: g(c,'Remarks'),
        }));
        state.urs = (data.urs||[]).map(u => ({
          id: g(u,'URS ID'),
          name: g(u,'Full Name'),
          department: g(u,'Department'),
          degree: g(u,'Highest Degree'),
          specialization: g(u,'Specialization'),
          email: g(u,'Email'),
          contact: g(u,'Contact No.'),
          available: g(u,'Available Days/Hours'),
          status: g(u,'Status'),
          ay: g(u,'AY Appointed'),
        }));
        state.financial = data.financial||{};
        state.config = data.config||{};
        state.loading = false;
        updateHeader();
        renderView();
      })
      .withFailureHandler(err => {
        state.loading = false;
        toast('Failed to load data: ' + err.message, 'err');
        renderError(err.message);
      })
      .getDashboardData();
  }

  function updateClientInState(rowNum, updates) {
    const idx = state.clients.findIndex(c => String(c.row) === String(rowNum));
    if (idx !== -1) {
      Object.assign(state.clients[idx], updates);
    }
    recalcFinancial();
  }

  function recalcFinancial() {
    const paid = state.clients.filter(c => g(c,'payStatus') === 'Paid');
    state.financial = {
      grossFees: paid.reduce((s,c) => s + (g(c,'totalFee')||0), 0),
      ursHonoraria: paid.reduce((s,c) => s + (g(c,'ursShare')||0), 0),
      unitShare: paid.reduce((s,c) => s + (g(c,'unitShare')||0), 0),
      paidCount: paid.length,
      pendingCount: state.clients.filter(c => g(c,'payStatus') === 'Pending').length,
      completedCount: state.clients.filter(c => g(c,'status') === 'Completed').length,
      inProgressCount: state.clients.filter(c => g(c,'status') === 'In Progress').length,
      newCount: state.clients.filter(c => g(c,'status') === 'New').length,
      totalCount: state.clients.length,
    };
  }

  // ── CLIENTS TABLE ────────────────────────────────────────
  function getFilteredClients() {
    return state.clients.filter(c => {
      if (state.filterPay !== 'All' && g(c,'payStatus') !== state.filterPay) return false;
      if (state.filterStat !== 'All' && g(c,'status') !== state.filterStat) return false;
      if (state.filterURS !== 'All') {
        if (state.filterURS === 'Unassigned' && g(c,'assignedURS')) return false;
        if (state.filterURS !== 'Unassigned' && g(c,'assignedURS') !== state.filterURS) return false;
      }
      if (state.searchQ) {
        const q = state.searchQ.toLowerCase();
        const searchable = `${g(c,'name')} ${g(c,'title')} ${g(c,'id')} ${g(c,'department')} ${g(c,'idNum')}`.toLowerCase();
        if (!searchable.includes(q)) return false;
      }
      return true;
    });
  }

      byURSMap[k].totalFee  += g(c,'totalFee')||0;
      byURSMap[k].ursShare  += g(c,'ursShare')||0;
      byURSMap[k].unitShare += g(c,'unitShare')||0;

  function saveClientEdits(rowNum) {
    const updates = {
      'OR Number':       document.getElementById('edit-orNum').value,
      'Payment Date':    document.getElementById('edit-payDate').value,
      'Payment Status':  document.getElementById('edit-payStatus').value,
      'Status':          document.getElementById('edit-status').value,
      'Affiliation':     document.getElementById('edit-affiliation').value,
      'Assigned URS':    document.getElementById('edit-assignedURS').value,
      'Total Fee (₱)':   parseFloat(document.getElementById('edit-totalFee').value) || 0,
      'Remarks':         document.getElementById('edit-remarks').value,
    };

    google.script.run
      .withSuccessHandler(result => {
        if (result.success) {
          updateClientInState(rowNum, updates);
          toast('Client record updated successfully.');
          closeModal();
          renderView();
        } else {
          toast('Update failed: ' + result.message, 'err');
        }
      })
      .withFailureHandler(err => {
        toast('Save failed: ' + err.message, 'err');
      })
      .updateClientBatch(rowNum, updates);
  }

        try {
          const data = JSON.parse(this.dataset.client.replace(/&#39;/g, "'"));
          showClientModal(data);
        } catch(e) { toast('Could not open client record.', 'err'); }
      });
    });
  }

  function attachClientsTableHandlers() {
    document.querySelectorAll('table.tbl tbody tr').forEach(el => {
      el.addEventListener('click', function(e) {
        if (e.target.closest('.btn')) return;
        try {
          const data = JSON.parse(this.dataset.client.replace(/&#39;/g, "'"));
          showClientModal(data);
        } catch(e) { toast('Could not open client record.', 'err'); }
      });
    });

    const searchQ = document.getElementById('search-q');
    if (searchQ) {
      searchQ.addEventListener('input', debounce(() => {
        state.searchQ = searchQ.value;
        renderClients();
      }, 300));
    }

    const filterPay = document.getElementById('filter-pay');
    if (filterPay) filterPay.addEventListener('change', () => { state.filterPay = filterPay.value; renderClients(); });

    const filterStat = document.getElementById('filter-stat');
    if (filterStat) filterStat.addEventListener('change', () => { state.filterStat = filterStat.value; renderClients(); });

    const filterURS = document.getElementById('filter-urs');
    if (filterURS) filterURS.addEventListener('change', () => { state.filterURS = filterURS.value; renderClients(); });

    const clearBtn = document.getElementById('clear-filters');
    if (clearBtn) clearBtn.addEventListener('click', () => {
      state.searchQ = ''; state.filterPay = 'All'; state.filterStat = 'All'; state.filterURS = 'All';
      renderClients();
    });
  }

  function debounce(fn, delay) {
    let t;
    return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), delay); };
  }

  function generateReportDirect(type) {
    const period = (state.config.sem || 'First Semester') + ' AY ' + (state.config.ay || '2025-2026');
    const reportType = type === '059' ? 'FM-RIS-059' : 'FM-RIS-060';
    const reportName = type === '059' ? 'Semestral Report' : 'Honoraria Requisition';

    google.script.run
      .withSuccessHandler(result => {
        if (result.success && result.url) {
          toast('Report generated successfully! Opening...', 'ok');
          window.open(result.url, '_blank');
        } else {
          toast('Generation failed: ' + (result.message || 'Unknown error'), 'err');
        }
      })
      .withFailureHandler(err => {
        toast('Error: ' + err.message, 'err');
      })
      .generateReportDirect(type === '059' ? 'FM-RIS-059' : 'FM-RIS-060', period);
  }

  function escHtml(s) {
    return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function switchView(view) {
    state.view = view;
    renderView();
  }

  // ── NAV ──────────────────────────────────────────────────
  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => switchView(btn.dataset.view));
  });

  // ── MODAL OVERLAY CLICK-TO-CLOSE ──────────────────────────
  document.getElementById('modal-root').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  // ═══════════════════════════════════════════════════════════
  //  INIT
  // ═══════════════════════════════════════════════════════════
  document.addEventListener('DOMContentLoaded', loadAll);
</script>
</body>
</html>
